<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PropTechUSA UFC Intelligence API">
  <title>PropTechUSA UFC Intelligence API</title>
  <desc>Original mark: a strike pulse crossing two chamfered cage corners. Four-sided by design, not an octagon, and not derived from UFC, Zuffa or TKO marks.</desc>
  <!-- Designed at 16px first. Three elements only — ground, two corner brackets, one pulse — because a
       favicon that needs a fourth shape has already lost the tab strip. The internal cage grid that an
       earlier revision carried was removed for exactly that reason. -->

  <!-- Ground: the site's own charcoal, so the tile reads as one solid shape against light or dark chrome. -->
  <rect width="64" height="64" rx="13" fill="#14110d"/>

  <!-- Two opposed cage corners. Heavy stroke and pushed hard into the corners so they never collide with
       the pulse at small sizes; they frame rather than compete. -->
  <g fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="butt">
    <path d="M10 24V15.5L15.5 10H24"/>
    <path d="M54 40v8.5L48.5 54H40"/>
  </g>

  <!-- The strike pulse. Cream, because on charcoal cream holds its shape at 16px where gold silts up.
       Five points, no tail detail and no overlapping node: everything that survived the 16px test and
       nothing that did not. One rise, one deep fall, one recovery — a strike and its answer. -->
  <path d="M9 35h13l7-16 8 25 5.5-13H55"
        fill="none" stroke="#f5f1eb" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
