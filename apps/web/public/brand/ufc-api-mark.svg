<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PropTechUSA UFC Intelligence API">
  <title>PropTechUSA UFC Intelligence API</title>
  <!-- Original PropTechUSA fight mark: two opposing forms colliding on a gold data node inside an angular
       cage ring. Reads as a clash before it reads as data. Not derived from UFC, Zuffa or TKO trade dress. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221d15"/>
      <stop offset="1" stop-color="#0b0906"/>
    </linearGradient>
  </defs>
  <path d="M20 2h24l18 18v24L44 62H20L2 44V20z" fill="url(#g)"/>
  <path d="M20 3.6h24l17.4 17.4v22L44 60.4H20L3.6 43V21z" fill="none" stroke="#d4af37" stroke-width="3.2"/>
  <!-- left striker: bold wedge driving right -->
  <path d="M9 18l17 12.5-17 12.5z" fill="#f5f1eb"/>
  <path d="M9 18l17 12.5-17 12.5z" fill="none" stroke="#f5f1eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- right striker: mirrored wedge driving left, set back in bronze -->
  <path d="M55 18L38 30.5 55 43z" fill="#a08348"/>
  <path d="M55 18L38 30.5 55 43z" fill="none" stroke="#a08348" stroke-width="3" stroke-linejoin="round"/>
  <!-- collision node -->
  <circle cx="32" cy="30.5" r="6.4" fill="#0b0906"/>
  <circle cx="32" cy="30.5" r="5" fill="#d4af37"/>
</svg>
