# PropTechUSA UFC Intelligence API — commercial gateway + developer portal.
#
# One Worker serves ufc.proptechusa.ai:
#   static portal (apps/web/dist)           /, /docs, /pricing, /learn/fight-dna, /dashboard, /openapi.json
#   commercial gateway (src/index.js)       /v1/ufc/*, /health, /dashboard/api/*, /admin/*
#
# Default environment = PREVIEW on workers.dev (no custom domain, no DNS change).
# `wrangler deploy --env production` attaches the custom domain ufc.proptechusa.ai — run only after the
# preview gate in docs/DEPLOYMENT.md passes.

name = "proptechusa-ufc-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true
preview_urls = true

[assets]
directory = "../apps/web/dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/v1/*", "/health", "/dashboard/api/*", "/admin/*", "/webhooks/*"]

[vars]
GATEWAY_ENV = "preview"
UPSTREAM_BASE_URL = "https://ufc-api.propbetedge.ai"
PUBLIC_HOST = "https://proptechusa-ufc-api.sales-fd3.workers.dev"
# Secrets (never in this file):
#   npx wrangler secret put ADMIN_TOKEN              admin key-issuance API + scripts/issue-key.mjs
#   npx wrangler secret put RAPIDAPI_PROXY_SECRET    value from the RapidAPI provider console (Settings → Proxy secret)
#   npx wrangler secret put UPSTREAM_API_KEY         optional; forwarded as X-API-Key once the canonical host enables REQUIRE_API_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET     signing secret of the Stripe webhook endpoint for /webhooks/stripe
#   npx wrangler secret put STRIPE_SECRET_KEY         restricted key: read subscriptions + create billing-portal sessions

[[kv_namespaces]]
binding = "API_KEYS"
id = "91103613c6e2490c928e35b7c7d35121"

[[durable_objects.bindings]]
name = "USAGE_COUNTER"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "ufc_api_usage"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# THERE IS NO SECOND ENVIRONMENT, AND ufc.proptechusa.ai IS NOT OURS TO CLAIM.
#
# This default environment IS the production gateway. It serves every customer
# request at https://proptechusa-ufc-api.sales-fd3.workers.dev (the `preview`
# value of GATEWAY_ENV below is historical; see docs/DEPLOYMENT.md before
# changing it, because gateway/src/stripe.js reads it).
#
# ufc.proptechusa.ai is the Vercel-hosted portal: the zone proptechusa.ai is on
# Cloudflare DNS and the record is a CNAME to vercel-dns. An [env.production]
# block with `routes = [{ pattern = "ufc.proptechusa.ai", custom_domain = true }]`
# used to live here. Deploying it would have registered the Custom Domain and
# REWRITTEN that DNS record, moving the public site off Vercel. It is removed on
# purpose, together with the deploy:production scripts, and tests/contract.test.mjs
# fails the build if either comes back. Routing that hostname is a deliberate DNS
# decision, never a side effect of a deploy command.
