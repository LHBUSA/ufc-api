info:
  title: PropTechUSA UFC Intelligence API
  version: 2026-09-06.3+gw.2026-09-07.1
  summary: Normalized UFC data plus proprietary PropBetEdge Fight DNA, delivered through one developer API.
  description: |-
    **UFC data built for developers.** Normalized events, fighters, cards, results and round-level statistics, plus proprietary PropBetEdge Fight DNA and Matchup DNA.

    This is the commercial distribution contract for the PropTechUSA UFC Intelligence API. It exposes a plan-gated subset of the canonical PropBetEdge UFC API (data-contract version `2026-09-06.3`, Fight DNA definition version 1). Response bodies are identical to the canonical API; the gateway adds authentication, entitlement, quota and rate-limit headers only.

    ### Authentication
    `Authorization: Bearer pt_ufc_live_…` (or `X-API-Key`). Keys are issued per plan; the secret is shown once.

    ### Plans
    | Plan | Price | Requests / month | Requests / minute | Unlocks |
    | --- | --- | --- | --- | --- |
    | **Developer** | $79/mo | 25,000 | 60 | Core UFC data |
    | **Pro** | $199/mo | 100,000 | 180 | Fighter intelligence |
    | **Ultra** | $499/mo | 500,000 | 600 | Matchup intelligence |
    | **Scale** | $1499/mo | 2,000,000 | 1200 | Production infrastructure |
    | **Enterprise** | Let's talk | custom | custom | Custom |

    Every operation below carries `x-plan` (minimum plan) and `x-origin` (SOURCE_FACT, PBE_DERIVED, LICENSED, EDITORIAL, MEDIA, THIRD_PARTY_LINK).

    ### Origin labels
    - **SOURCE_FACT** — normalized facts from ESPN / UFC Stats / ufc.com (events, results, strike counts, official rankings snapshot).
    - **PBE_DERIVED** — computed by the PropBetEdge Fight DNA builder from normalized fight history. Every derived value is a `MetricObject` carrying sample size, provenance, confidence, as-of date and definition version. Not official UFC statistics.
    - **LICENSED** — reserved for licensed enrichment (position profiles); explicitly unavailable until a licensed source exists.
    - **EDITORIAL** — PropBetEdge newsroom content. **MEDIA** — image metadata with license and attribution (render the credit). **THIRD_PARTY_LINK** — ids and official URLs only; nothing is rehosted.

    ### Truthful nulls
    Missing data is `null` or an explicit `404 dna_not_available` / `503 *_not_available`. The API never returns fabricated zeroes, odds, picks or probabilities.

    PropTechUSA and PropBetEdge are independent products and are not affiliated with, endorsed by, or sponsored by UFC, Zuffa LLC, TKO Group, ESPN or any sportsbook.
