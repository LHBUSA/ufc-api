              - to
            properties:
              path:
                type: string
              from: {}
              to: {}
    CardShock:
      type: object
      description: Stable placeholder until the Card Shock engine exists. No score is computed.
      required:
        - status
        - reason
      properties:
        status:
          type: string
          const: not_computed
        reason:
          type: string
          const: card_shock_engine_not_built
    IntelligenceBout:
      type: object
      required:
        - bout
        - ledger_status
        - latest
        - hours_to_start
        - checkpoints
        - snapshots
        - has_dna
        - wire_count
        - result
        - sources
        - diff
        - card_shock
      properties:
        bout:
          type: object
        ledger_status:
          type: string
          enum:
            - ok
            - no_checkpoint
        latest:
          type:
            - object
            - "null"
          description: "{id, checkpoint, captured_at, ledger_version, scheduled_start, hours_to_start_at_capture}"
        hours_to_start:
          type:
            - number
            - "null"
          description: scheduled_start minus meta.generated_at, in hours
        checkpoints:
          type: array
          items:
            type: string
        snapshots:
          type: integer
        bout_state:
          type:
            - object
            - "null"
        fighters:
          type:
            - object
            - "null"
        has_dna:
          type: object
          properties:
            a:
              type:
                - boolean
                - "null"
            b:
              type:
                - boolean
                - "null"
        dna:
          type:
            - object
            - "null"
        wire_count:
          type:
            - integer
            - "null"
        result:
          type:
            - object
            - "null"
        sources:
          type:
            - object
            - "null"
          description: "{weigh_in, odds, market, model} status strings"
        diff:
          oneOf:
            - $ref: "#/components/schemas/LedgerDiff"
            - type: "null"
        card_shock:
          $ref: "#/components/schemas/CardShock"
    SuccessEnvelope:
      type: object
      required:
        - ok
        - data
        - meta
      properties:
        ok:
          type: boolean
          const: true
        data: {}
        meta:
          type: object
          properties:
            api:
              type: string
              const: PropSports UFC
            version:
              type: string
            request_id:
              type: string
    ErrorEnvelope:
      type: object
      required:
        - ok
        - data
        - error
        - meta
      properties:
        ok:
          type: boolean
          const: false
        data:
          type: "null"
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            detail: {}
        meta:
          type: object
    Plan:
      type: string
      enum:
        - developer
        - pro
        - ultra
        - scale
        - enterprise
      description: "Commercial plan ladder: Developer $79, Pro $199, Ultra $499, Scale $1,499, Enterprise custom."
    Provenance:
      type: object
      description: Evidence carried by every PBE_DERIVED value (subset of MetricObject).
      properties:
        sample_bouts:
          type: integer
        sample_rounds:
          type: integer
        sample_seconds:
          type: integer
        confidence:
          $ref: "#/components/schemas/Confidence"
        coverage_status:
          $ref: "#/components/schemas/Confidence"
        definition_version:
          type: integer
        origin:
          $ref: "#/components/schemas/DnaOrigin"
        source_families:
          type: array
          items:
            type: string
        as_of_date:
          type: string
          format: date
    Coverage:
      $ref: "#/components/schemas/Confidence"
    FighterDna:
      type: object
      properties:
        fighter:
          $ref: "#/components/schemas/DnaFighter"
        snapshot:
          $ref: "#/components/schemas/DnaSnapshot"
    RoundProfile:
      type: object
      description: "round_profile family: per-round pace/absorption MetricObjects plus pace retention, championship-round delta and defensive drift."
      additionalProperties: true
    FinishProfile:
      type: object
      description: "finish_profile family: finish_rate, ko_finish_rate, submission_finish_rate, finish_round_distribution, finish_time_median_sec, finished_by."
      additionalProperties: true
