        - model_status
        - story_class
      properties:
        impact_score:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 5
          description: Analysis, not a price.
        markets:
          type: array
          items:
            type: string
        odds_status:
          type: string
          enum:
            - unavailable
            - snapshot
            - live
        model_status:
          type: string
          enum:
            - unavailable
            - priced
        story_class:
          type:
            - string
            - "null"
    RankedFighter:
      type: object
