      summary: Global live wire — attributed newsroom headlines, deduped, newest first, mapped to internal pages
      description: |-
        Source of truth is `ufc_news_items` joined to `ufc_news_sources`. Items are newest first; near-identical headlines from several feeds are collapsed (normalized title: lowercase, punctuation and stopwords stripped, first 60 chars) keeping the earliest-published copy. `taxonomy` is the first label string (or null); the full taxonomy object is under `taxonomy_detail`. `internal_url` is `/news/<slug>` when a published PropBetEdge article shares the bout, shares the event plus a fighter, or cites the item in `sources`; else `/fights/<a>-vs-<b>-<event-slug>` for a linked bout; else `/events/<event-slug>`; else `/fighters/<name>-<slug_id>` when exactly one fighter is linked; else null (link the attributed `source_url` instead). Titles and summaries are never fabricated. Responses carry `Cache-Control: public, max-age=15, s-maxage=30, stale-while-revalidate=120` and CORS `*` so the rail can poll from the browser.

