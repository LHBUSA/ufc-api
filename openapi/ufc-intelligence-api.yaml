  /v1/ufc/events/{id}/weigh-ins:
    get:
      summary: One event's weigh-ins with coverage state, and optionally the full source history
      description: |-
        `data.coverage` is the row of `ufc_weigh_in_event_summary` plus `state` (`live` while any reading is pending, otherwise `final`), or `{ state: no_data }` when the card has no readings, so "nobody has weighed in yet" is distinguishable from "not covered". `coverage.confirmations` counts readings an official source verified at the same weight; `coverage.corrections` counts readings whose weight a later source changed. `data.results` are the current readings (same fields as /v1/ufc/weigh-ins). With `include=history`, `data.history` is every stored reading newest first, superseded ones included, each with `supersession_kind` (`confirmation`, `correction` or null for an original reading) and `superseded_weight_lbs`. Also served at `/v1/events/{id}/weigh-ins`.

        **Plan:** Developer and above. **Origin:** SOURCE_FACT.
      parameters:
        - name: id
          in: path
          required: true
          description: Event UUID, UFC Stats event id or ESPN event id
          schema:
            type: string
        - name: include
          in: query
          schema:
            type: string
            enum:
              - history
      responses:
        "200":
          description: Success envelope `{ ok, data, meta }` — identical to the canonical API.
          headers: *a1
          content:
