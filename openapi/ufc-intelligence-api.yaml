        note:
          type: string
    DnaQueryRow:
      type: object
      required:
        - fighter
        - as_of_date
        - metric_key
        - metric
        - sample
        - origin
      properties:
        fighter:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
                - string
                - "null"
            nickname:
              type:
                - string
                - "null"
            slug_id:
              type:
                - string
                - "null"
            stance:
              type:
                - string
                - "null"
            is_active:
              type:
                - boolean
                - "null"
        as_of_date:
          type: string
          format: date
        metric_key:
          type: string
        metric:
          $ref: "#/components/schemas/MetricObject"
        sample:
          type: object
        opponent_stance:
          type: string
          description: stance-split mode only
        record:
          $ref: "#/components/schemas/Record"
        origin:
          $ref: "#/components/schemas/DnaOrigin"
    VideoType:
      type: string
      enum:
        - embedded_episode
        - countdown
        - fight_preview
        - full_fight
        - highlights
        - interview
        - press_conference
        - media_day
        - weigh_in
        - faceoff
        - post_fight
        - analysis
        - other
    Video:
      type: object
      description: Official video metadata from an allowlisted channel. Published rows only; playback stays on the provider.
      required:
        - id
        - provider
        - provider_video_id
        - url
        - embed_url
        - thumbnail_url
        - title
        - published_at
        - duration_sec
        - embeddable
        - video_type
        - channel
        - links
        - resolver_confidence
        - attribution
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          example: youtube
        provider_video_id:
          type: string
        url:
          type: string
          format: uri
          description: Provider watch URL.
        embed_url:
          type:
            - string
            - "null"
          format: uri
          description: https://www.youtube-nocookie.com/embed/<provider_video_id>; null for non-YouTube providers.
        thumbnail_url:
          type:
            - string
            - "null"
          format: uri
        title:
          type: string
        published_at:
          type:
            - string
            - "null"
          format: date-time
        duration_sec:
          type:
            - integer
            - "null"
          description: null when unknown
        embeddable:
          type:
            - boolean
            - "null"
          description: null when not yet checked
        live_broadcast_state:
          type:
            - string
            - "null"
        video_type:
          $ref: "#/components/schemas/VideoType"
        video_type_label:
          type: string
        channel:
          type: object
          required:
            - id
            - name
            - verified
          properties:
            id:
              type:
                - string
                - "null"
            name:
              type:
                - string
                - "null"
            verified:
              type: boolean
              description: channel_verified_source at capture
        links:
          type: object
          required:
            - event_id
            - bout_id
            - article_id
            - fighter_ids
          properties:
            event_id:
              type:
                - string
                - "null"
              format: uuid
            bout_id:
              type:
                - string
                - "null"
              format: uuid
            article_id:
              type:
                - string
                - "null"
              format: uuid
            fighter_ids:
              type: array
              items:
                type: string
                format: uuid
        resolver_confidence:
          type: string
          enum:
            - none
            - low
            - medium
            - high
        attribution:
          type: string
          example: YouTube · UFC
          description: Render verbatim as the credit.
        captured_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    LedgerSnapshot:
      type: object
      description: "One append-only ufc_fight_state_ledger row. Blocks without a source are explicit {status: unavailable, reason} objects."
      required:
        - id
        - bout_id
        - event_id
        - checkpoint
        - ledger_version
        - captured_at
        - bout_state
        - fighters
        - rankings
        - dna
        - weigh_in
        - wire
        - odds
        - market
        - model
        - result
        - provenance
      properties:
        id:
          type: string
          format: uuid
        bout_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        checkpoint:
          type: string
          enum:
            - t_minus_7d
            - t_minus_72h
            - t_minus_24h
            - post_weigh_in
            - t_minus_3h
            - close
            - post_result
            - ad_hoc
        ledger_version:
          type: integer
        captured_at:
          type: string
          format: date-time
        scheduled_start:
          type:
            - string
            - "null"
          format: date-time
        event_date:
          type:
            - string
            - "null"
          format: date
        hours_to_start:
          type:
            - number
            - "null"
        bout_state:
          type: object
        fighters:
          type: object
          description: "{a, b, stance_context}"
        rankings:
          type: object
        dna:
          type: object
          description: "{a, b}: latest snapshot in force per fighter, or {status: unavailable}"
        weigh_in:
          type: object
        wire:
          type: object
          description: "{status, count, items[], articles[]}"
        odds:
          type: object
        market:
          type: object
        model:
          type: object
        result:
          type: object
          description: "{status: pending | final, winner_id, method, round, time_sec, ...}"
        provenance:
          type: object
    LedgerDiff:
      type: object
      description: Deterministic shallow diff between consecutive snapshots (newer vs older); no interpretation.
      required:
        - newer
        - older
        - hours_between
        - changed
        - changes
      properties:
        newer:
          type: object
          properties:
            id:
              type: string
            checkpoint:
              type: string
            captured_at:
              type: string
        older:
          type: object
          properties:
            id:
              type: string
            checkpoint:
              type: string
            captured_at:
              type: string
        hours_between:
          type:
            - number
            - "null"
        changed:
          type: array
          items:
            type: string
          example:
            - fighters.a.stance
            - fighters.stance_context
            - wire.count
        changes:
          type: array
          items:
            type: object
            required:
              - path
              - from
              - to
            properties:
              path:
                type: string
              from: {}
              to: {}
    CardShock:
      type: object
      description: Stable placeholder until the Card Shock engine exists. No score is computed.
      required:
        - status
        - reason
      properties:
        status:
          type: string
          const: not_computed
        reason:
          type: string
          const: card_shock_engine_not_built
    IntelligenceBout:
      type: object
      required:
        - bout
        - ledger_status
        - latest
        - hours_to_start
        - checkpoints
        - snapshots
        - has_dna
        - wire_count
        - result
        - sources
        - diff
        - card_shock
      properties:
        bout:
          type: object
        ledger_status:
          type: string
          enum:
            - ok
            - no_checkpoint
        latest:
          type:
            - object
            - "null"
          description: "{id, checkpoint, captured_at, ledger_version, scheduled_start, hours_to_start_at_capture}"
        hours_to_start:
          type:
            - number
            - "null"
          description: scheduled_start minus meta.generated_at, in hours
        checkpoints:
          type: array
          items:
            type: string
        snapshots:
          type: integer
        bout_state:
          type:
            - object
            - "null"
        fighters:
          type:
            - object
            - "null"
        has_dna:
          type: object
          properties:
            a:
              type:
                - boolean
                - "null"
            b:
              type:
                - boolean
                - "null"
        dna:
          type:
            - object
            - "null"
        wire_count:
          type:
            - integer
            - "null"
        result:
          type:
            - object
            - "null"
        sources:
          type:
            - object
            - "null"
          description: "{weigh_in, odds, market, model} status strings"
        diff:
          oneOf:
            - $ref: "#/components/schemas/LedgerDiff"
            - type: "null"
        card_shock:
          $ref: "#/components/schemas/CardShock"
    SuccessEnvelope:
      type: object
      required:
        - ok
        - data
        - meta
      properties:
        ok:
          type: boolean
          const: true
        data: {}
        meta:
          type: object
          properties:
            api:
              type: string
              const: PropSports UFC
            version:
              type: string
            request_id:
              type: string
    ErrorEnvelope:
      type: object
      required:
        - ok
        - data
        - error
        - meta
      properties:
        ok:
          type: boolean
          const: false
        data:
          type: "null"
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            detail: {}
        meta:
          type: object
    Plan:
      type: string
      enum:
        - developer
        - pro
        - ultra
        - scale
        - enterprise
      description: "Commercial plan ladder: Developer $79, Pro $199, Ultra $499, Scale $1,499, Enterprise custom."
    Provenance:
      type: object
      description: Evidence carried by every PBE_DERIVED value (subset of MetricObject).
      properties:
        sample_bouts:
          type: integer
        sample_rounds:
          type: integer
        sample_seconds:
          type: integer
        confidence:
          $ref: "#/components/schemas/Confidence"
        coverage_status:
          $ref: "#/components/schemas/Confidence"
        definition_version:
          type: integer
        origin:
          $ref: "#/components/schemas/DnaOrigin"
        source_families:
          type: array
          items:
            type: string
        as_of_date:
          type: string
          format: date
    Coverage:
      $ref: "#/components/schemas/Confidence"
    FighterDna:
      type: object
      properties:
        fighter:
          $ref: "#/components/schemas/DnaFighter"
        snapshot:
          $ref: "#/components/schemas/DnaSnapshot"
    RoundProfile:
      type: object
      description: "round_profile family: per-round pace/absorption MetricObjects plus pace retention, championship-round delta and defensive drift."
      additionalProperties: true
    FinishProfile:
      type: object
      description: "finish_profile family: finish_rate, ko_finish_rate, submission_finish_rate, finish_round_distribution, finish_time_median_sec, finished_by."
      additionalProperties: true
