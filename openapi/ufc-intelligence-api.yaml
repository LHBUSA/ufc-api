              required:
                - name
                - ufc_slug
                - fighter_id
                - fighter
              properties:
                name:
                  type: string
                ufc_slug:
                  type:
                    - string
                    - "null"
                fighter_id:
                  type:
                    - string
                    - "null"
                  format: uuid
