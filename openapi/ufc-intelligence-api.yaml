  /v1/ufc/fighters/{id}:
    get:
      summary: Fighter profile (composite fighter-page contract via include)
      description: |-
        Default response is the fighter row plus `slug_id`, `images[]` (full licensed media with `image_url`, `card_url`, `thumb_url`) and `primary_image`. Includes are additive and never change the base fields: `ranking` adds `ranking` (verified positions or null when no snapshot), `next` adds `next_bout` (next scheduled bout with event + opponent, or null), `history` adds `history[]` (bout + event + opponent + result + outcome, newest first, `history_limit` 1..250), `stats` adds `stats` (`career_snapshot` display-only fields with the leakage warning, plus `computed` per-bout totals and career aggregates from UFC Stats round rows, with provenance). `media` is accepted and always on.

        **Plan:** Developer and above. **Origin:** SOURCE_FACT. **Parameter gates:** `include=stats` requires **pro** (adds computed career rates to the fighter composite).
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/FighterInclude"
        - name: history_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
      responses:
        "200":
          description: Success envelope `{ ok, data, meta }` — identical to the canonical API.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
