        `data.snapshots[]` are `LedgerSnapshot` rows (every block) from the append-only `ufc_fight_state_ledger`; `data.diffs[]` are `LedgerDiff` objects for consecutive snapshots (shallow, interpretation-free; see `meta.diff_rules`). `data.card_shock` is the stable `{status: not_computed}` placeholder. A bout with no rows is `200` with empty arrays; `503 ledger_not_available` while migration 005 is not applied.

        **Plan:** Ultra and above. **Origin:** PBE_DERIVED.
