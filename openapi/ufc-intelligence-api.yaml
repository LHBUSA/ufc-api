  /v1/ufc/fighters/{id}/dna:
    get:
      summary: Fighter Fight DNA snapshot (latest, or latest at/before as_of)
      description: |-
        `data.fighter` (compact, with `primary_image`, `stance`, `is_active`) plus `data.snapshot` (`DnaSnapshot`). `as_of_date` is exclusive: the snapshot dated D contains bouts with event_date < D, so a bout fought on D is excluded by the snapshot dated D; `?as_of=D` resolves to the latest snapshot with `as_of_date <= D` (`meta.requested_as_of`, `meta.resolved_as_of`). `404 dna_not_available` with `data:null` when no snapshot exists (`detail.reason = no_snapshot | no_snapshot_at_or_before_as_of`); `503 dna_not_available` while the schema is not applied. Nothing is synthesized.

        **Plan:** Pro and above. **Origin:** PBE_DERIVED. **Parameter gates:** `as_of=…` requires **pro** (historical as-of reconstruction).
