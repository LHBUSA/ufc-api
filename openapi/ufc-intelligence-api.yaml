  parameters:
    EntityId:
      name: id
      in: path
      required: true
      description: Internal UUID, 16-character UFCStats ID, or ESPN source ID.
      schema:
        type: string
    FighterInclude:
      name: include
      in: query
      required: false
      description: Comma-separated additive blocks. Unknown values return 400 invalid_include.
      schema:
        type: string
        example: media,ranking,next,history,stats,videos
    CardInclude:
      name: include
      in: query
      required: false
      description: Comma-separated additive blocks (`videos` adds the latest 6 published official videos, or null while migration 006 is unapplied). Unknown values return 400 invalid_include.
      schema:
        type: string
        example: media,results,stats,videos
    AsOf:
      name: as_of
      in: query
      required: false
      description: Calendar date (YYYY-MM-DD). Resolves to the latest snapshot with as_of_date <= as_of. Snapshot dates are exclusive (a snapshot dated D contains bouts with event_date < D). Invalid dates are 400 invalid_as_of.
      schema:
        type: string
        format: date
    DefinitionVersion:
      name: version
      in: query
      required: false
      description: Fight DNA definition_version (default 1).
      schema:
        type: integer
        minimum: 1
        maximum: 99
        default: 1
  schemas:
    PrimaryImage:
      type: object
      description: Compact licensed media reference. Null wherever no approved image exists; never fabricated.
      required:
        - image_url
        - card_url
        - thumb_url
        - author
        - license
        - source_url
        - kind
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
        image_url:
          type: string
          format: uri
          description: "Durable first-party URL: {UFC_IMAGE_BASE_URL}/{r2_key} (portrait, <=1200px long edge)."
        card_url:
          type:
            - string
            - "null"
          format: uri
          description: 800x1000 attention crop beside the portrait; null for non-portrait keys.
        thumb_url:
          type:
            - string
            - "null"
          format: uri
          description: 320x400 cover crop beside the portrait; null for non-portrait keys.
        author:
          type:
            - string
            - "null"
        license:
          type:
            - string
            - "null"
        source_url:
          type:
            - string
            - "null"
          format: uri
          description: Wikimedia Commons file page; render as the credit link.
        kind:
          type:
            - string
            - "null"
          enum:
            - wikimedia
            - statcard
            - public_domain
            - licensed_editorial
            - official_press
            - null
        attribution_text:
          type:
            - string
            - "null"
          description: Rendered credit line from the 006 media registry; null when not recorded.
        rights_label:
          type:
            - string
            - "null"
          description: 'e.g. "CC BY-SA 4.0", "Public domain", "Licensed (contract #)"; null when not recorded.'
    ImageRef:
      allOf:
        - $ref: "#/components/schemas/PrimaryImage"
        - type: object
          properties:
            r2_key:
              type: string
            fighter_id:
              type:
                - string
                - "null"
              format: uuid
            created_at:
              type:
                - string
                - "null"
              format: date-time
    HeroImage:
      allOf:
        - $ref: "#/components/schemas/PrimaryImage"
        - type: object
          properties:
            fighter_id:
              type:
                - string
                - "null"
              format: uuid
            ref:
              type: string
              description: The article's hero_image_ref (ufc_images.id or storage key).
    BettorAngle:
      type: object
      description: "Editorial bettor-angle analysis from docs/editorial_contract.md. Analysis, labelled as such: impact_score is not a price, probability or pick. odds_status / model_status stay `unavailable` until verified data exists."
      required:
        - impact_score
        - markets
        - summary
        - supporting_facts
        - risks
        - watch_items
        - odds_status
        - model_status
      properties:
        impact_score:
          type: integer
          minimum: 1
          maximum: 5
          description: Editorial betting relevance (1 low, 5 high). Analysis, not a price.
        markets:
          type: array
          items:
            type: string
            enum:
              - moneyline
              - fight_goes_distance
              - total_rounds
              - method_of_victory
              - round_betting
              - significant_strikes
              - takedowns
        summary:
          type: string
          description: 2–5 sentences of analysis.
        supporting_facts:
          type: array
          minItems: 1
          items:
            type: string
          description: Each fact is traceable to matchup/archive fields.
        risks:
          type: array
          minItems: 1
          items:
            type: string
          description: At least one counter-case.
        watch_items:
          type: array
          items:
            type: string
        odds_status:
          type: string
          enum:
            - unavailable
            - snapshot
            - live
          description: "`unavailable` until verified odds exist in PropBetEdge data."
        model_status:
          type: string
          enum:
            - unavailable
            - priced
          description: "`unavailable` until a real model output exists."
    MarketWatch:
      type: object
      required:
        - status
        - markets
        - note
      properties:
        status:
          type: string
          enum:
            - unavailable
            - snapshot
            - live
        markets:
          type: array
          items:
            type: string
        note:
          type: string
    FighterFacts:
      type: object
      description: Fighter facts as printed in the fact block (percentages as printed, e.g. 42 = 42%); null fields when absent.
      properties:
        fighter_id:
          type: string
          format: uuid
        name:
          type: string
        nickname:
          type:
            - string
            - "null"
        slug:
          type: string
          description: web fighter slug (slugified name + slug_id).
        record:
          type: object
          properties:
            w:
              type: integer
            l:
              type: integer
            d:
              type: integer
            nc:
              type: integer
        age:
          type:
            - integer
            - "null"
        height_in:
          type:
            - number
            - "null"
        reach_in:
          type:
            - number
            - "null"
        stance:
          type:
            - string
            - "null"
        weight_lbs:
          type:
            - number
            - "null"
        career:
          type:
            - object
            - "null"
          properties:
            slpm:
              type:
                - number
                - "null"
            str_acc:
              type:
                - number
                - "null"
            sapm:
              type:
                - number
                - "null"
            str_def:
              type:
                - number
                - "null"
            td_avg:
              type:
                - number
                - "null"
            td_acc:
              type:
                - number
                - "null"
            td_def:
              type:
                - number
                - "null"
            sub_avg:
              type:
                - number
                - "null"
        archive:
          type:
            - object
            - "null"
          properties:
            fights:
              type: integer
            w:
              type: integer
            l:
              type: integer
            d:
              type: integer
            nc:
              type: integer
            ko:
              type: integer
            sub:
              type: integer
            dec:
              type: integer
            finish_rate:
              type:
                - number
                - "null"
            rounds_with_stats:
              type: integer
            totals:
              type: object
              properties:
                sig_l:
                  type: integer
                sig_a:
                  type: integer
                td_l:
                  type: integer
                td_a:
                  type: integer
                kd:
                  type: integer
                ctrl_sec:
                  type: integer
            last:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  opponent:
                    type: string
                  opponent_slug:
                    type:
                      - string
                      - "null"
                  result:
                    type: string
                  method:
                    type:
                      - string
                      - "null"
                  round:
                    type:
                      - integer
                      - "null"
                  event:
                    type: string
            days_since_last:
              type:
                - integer
                - "null"
    MatchupFacts:
      type: object
      required:
        - a
        - b
        - edges
      properties:
        a:
          $ref: "#/components/schemas/FighterFacts"
        b:
