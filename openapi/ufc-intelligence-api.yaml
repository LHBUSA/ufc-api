  /v1/ufc/dna/query:
    get:
      summary: Filter current Fight DNA snapshots (or stance splits) by one metric
      description: |-
        North-star filter, e.g. `?metric=pace_retention_r3_vs_r1&min=0.9`. Filters run in PostgREST on the stored MetricObject (`metrics-><key>->value` jsonb ordering, `metrics-><key>->>confidence`); only a fighter's latest snapshot (<= `as_of`) qualifies; the candidate scan is capped at 1000 rows (PostgREST max_rows) (`meta.truncated`). With `stance` the query runs over `ufc_fighter_stance_splits` for that opponent stance and `metric` must be one of finish_rate, ko_rate, sub_rate, sig_diff_per_min, kd_per_15, td_landed_per_15 (registry aliases accepted). Rows are `DnaQueryRow`, sorted by value (`order`, nulls last).

        **Plan:** Ultra and above. **Origin:** PBE_DERIVED.
      tags:
        - Fight DNA
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9_]{1,63}$
        - name: min
          in: query
          schema:
            type: number
        - name: max
          in: query
          schema:
            type: number
        - name: stance
          in: query
          schema:
            type: string
            enum:
              - ORTHODOX
              - SOUTHPAW
              - SWITCH
              - OPEN_STANCE
              - SIDEWAYS
              - UNKNOWN
        - name: min_confidence
          in: query
          schema:
            type: string
            enum:
              - insufficient
              - low
              - medium
              - high
            default: low
        - name: min_appearances
          in: query
          description: Stance-split mode only.
          schema:
            type: integer
            minimum: 0
            default: 1
        - name: active
          in: query
          schema:
            type: boolean
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/DefinitionVersion"
