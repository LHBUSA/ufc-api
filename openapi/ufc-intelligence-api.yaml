            - per_15
            - seconds
            - seconds_per_td
            - record
            - count
            - distribution
        numerator:
          type:
            - number
            - "null"
        denominator:
          type:
            - number
            - "null"
        sample_bouts:
          type: integer
        sample_rounds:
          type: integer
        sample_seconds:
          type: integer
        confidence:
          $ref: "#/components/schemas/Confidence"
        coverage_status:
