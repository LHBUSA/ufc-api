name: refresh-showcase

# Keeps the public showcase snapshot in step with the canonical UFC API while the historical
# backfill runs. Test fixtures under upstream/fixtures/ are deliberately NOT touched here:
# they stay deterministic for the gateway tests and the contract drift guard.

on:
  # Manual audit/fallback only. Production portal freshness is owned by the Cloudflare gateway
  # Worker's scheduled handler and /portal/snapshot runtime feed.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered"
        required: false
        default: "manual"

concurrency:
  group: refresh-showcase
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ufc-intelligence-v1
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The canonical API is public today. UPSTREAM_API_KEY is read from the environment only if the
      # upstream ever requires one; it is never written into the snapshot or shipped to the browser.
      - name: Refresh the public showcase snapshot
        env:
          UPSTREAM_API_KEY: ${{ secrets.UPSTREAM_API_KEY }}
        run: node scripts/refresh-showcase.mjs

      # A malformed or regressive upstream response fails the step above and leaves the last good
      # snapshot in place, so the site keeps rendering real data and the run goes red.
      - name: Verify the snapshot still builds the site
        run: npm run build

      # Fighter media must stay at parity with the consumer product. This fails the run on an
      # unexplained resolver mismatch or a URL we publish that does not load; a fighter nobody has a
      # picture of, and a deliberate rights difference, are reported but do not fail.
      - name: Audit fighter-media parity
        run: npm run media:audit:ci

      - name: Commit the verified refresh heartbeat
        id: commit
        run: |
          git config user.name "propbetedge-bot"
          git config user.email "sales@localhomebuyersusa.com"
          # generated_at is the portal's verified-refresh heartbeat. Commit it even when the
          # underlying counts/subjects did not change so production can prove it was rechecked.
          if git diff --quiet -- apps/web/src/generated/showcase.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "refresh produced no file diff"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          COUNTS=$(node -e 'const c=require("./apps/web/src/generated/showcase.json").counts;console.log(`${c.fighters} fighters, ${c.events} events, ${c.bouts} bouts, ${c.round_stat_rows} round rows`)')
          SUBJECTS=$(node -e 'const s=require("./apps/web/src/generated/showcase.json");console.log(`${s.event.event.name} · ${s.fighter.fighter.name} · ${s.matchup.fighters.map(f=>f.name).join(" vs ")} · ${s.rankings.division.label}`)')
          git add apps/web/src/generated/showcase.json
          git commit -m "showcase: refresh from canonical API

          $COUNTS
          $SUBJECTS"
          git push origin ufc-intelligence-v1

      # No production publish here. This workflow is now a manual snapshot audit only;
      # Cloudflare Worker cron owns live portal data and Vercel builds only ship UI/code changes.

      - name: Summary
        run: |
          node -e '
            const s = require("./apps/web/src/generated/showcase.json");
            const c = s.counts;
            console.log(`## Showcase refresh\n`);
            console.log(`- changed: ${process.env.CHANGED}`);
            console.log(`- generated_at: ${s.generated_at}`);
            console.log(`- api ${s.api_version}, Fight DNA v${s.fight_dna_definition_version}`);
            console.log(`- counts: ${c.fighters} fighters · ${c.events} events · ${c.bouts} bouts · ${c.results} results · ${c.round_stat_rows} round rows`);
            console.log(`- event: ${s.event.event.name} (${s.event.event.event_date})`);
            console.log(`- fighter: ${s.fighter.fighter.name}`);
            console.log(`- matchup: ${s.matchup.fighters.map(f => f.name).join(" vs ")} (${s.matchup.meta.comparable}/${s.matchup.meta.comparisons} comparable)`);
            console.log(`- rankings: ${s.rankings.division.label}`);
          ' >> "$GITHUB_STEP_SUMMARY"
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
