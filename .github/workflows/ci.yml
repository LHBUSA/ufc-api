name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # nightly live drift guard against the canonical API
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run generate
      - run: npm run openapi:lint
      - run: npm run contract:check
      - name: generated files are committed and current
        run: git diff --exit-code -- openapi/ufc-intelligence-api.yaml docs/UFC_API_ENTITLEMENTS.md
      - run: npm run build --workspace=apps/web
      - name: wrangler dry run
        run: cd gateway && npx wrangler deploy --dry-run --outdir /tmp/wrangler-dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true

  drift-live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:check:live
